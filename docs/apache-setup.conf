# Apache2 Virtual Host Configuration for CMMC Compliance Suite
# Save this as: /etc/apache2/sites-available/cmmc-suite.conf

<VirtualHost *:80>
    ServerName your-domain.com
    ServerAlias www.your-domain.com
    ServerAdmin admin@your-domain.com

    DocumentRoot /var/www/cmmc-suite/public

    <Directory /var/www/cmmc-suite/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # URL Rewriting - sends all requests to index.php
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^(.*)$ index.php [QSA,L]
        </IfModule>
    </Directory>

    # Prevent access to sensitive directories
    <Directory /var/www/cmmc-suite/config>
        Require all denied
    </Directory>

    <Directory /var/www/cmmc-suite/database>
        Require all denied
    </Directory>

    <Directory /var/www/cmmc-suite/storage>
        Require all denied
    </Directory>

    # Allow access to uploads directory (needed for logos, documents)
    <Directory /var/www/cmmc-suite/public/uploads>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/cmmc-suite-error.log
    CustomLog ${APACHE_LOG_DIR}/cmmc-suite-access.log combined

    # PHP Configuration
    <IfModule mod_php7.c>
        php_value upload_max_filesize 10M
        php_value post_max_size 10M
        php_value memory_limit 256M
        php_value max_execution_time 300
    </IfModule>

    # Security Headers
    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>
</VirtualHost>
