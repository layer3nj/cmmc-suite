# Apache2 SSL Virtual Host Configuration for CMMC Compliance Suite
# This file is typically auto-generated by certbot, but here's a template
# Save this as: /etc/apache2/sites-available/cmmc-suite-ssl.conf

<VirtualHost *:443>
    ServerName your-domain.com
    ServerAlias www.your-domain.com
    ServerAdmin admin@your-domain.com

    DocumentRoot /var/www/cmmc-suite/public

    <Directory /var/www/cmmc-suite/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # URL Rewriting
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^(.*)$ index.php [QSA,L]
        </IfModule>
    </Directory>

    # Prevent access to sensitive directories
    <Directory /var/www/cmmc-suite/config>
        Require all denied
    </Directory>

    <Directory /var/www/cmmc-suite/database>
        Require all denied
    </Directory>

    <Directory /var/www/cmmc-suite/storage>
        Require all denied
    </Directory>

    # Allow access to uploads directory
    <Directory /var/www/cmmc-suite/public/uploads>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # SSL Configuration (Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/your-domain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/your-domain.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/cmmc-suite-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/cmmc-suite-ssl-access.log combined

    # PHP Configuration
    <IfModule mod_php7.c>
        php_value upload_max_filesize 10M
        php_value post_max_size 10M
        php_value memory_limit 256M
        php_value max_execution_time 300
    </IfModule>

    # Security Headers
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https:; font-src 'self' data:;"
    </IfModule>
</VirtualHost>

# Redirect HTTP to HTTPS
<VirtualHost *:80>
    ServerName your-domain.com
    ServerAlias www.your-domain.com

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/cmmc-suite-redirect-error.log
    CustomLog ${APACHE_LOG_DIR}/cmmc-suite-redirect-access.log combined
</VirtualHost>
